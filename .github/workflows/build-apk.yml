name: Build APK
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create Android project
        run: |
          mkdir -p www
          echo '<html><body style="background:#000"></body></html>' > www/index.html
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "com.hogwarts.tradingschool",
            "appName": "HOGWARTS TRADING SCHOOL",
            "webDir": "www",
            "server": {
              "url": "https://hogwartstradingschool.github.io/HOGWARTS-TRADING-SCHOOL/",
              "allowNavigation": ["*.github.io", "*.google.com", "*.googleusercontent.com", "*.gstatic.com"]
            }
          }
          JSON
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap add android
      - name: Set logo
        run: |
          RES=android/app/src/main/res
          rm -f $RES/mipmap-anydpi-v26/ic_launcher.xml $RES/mipmap-anydpi-v26/ic_launcher_round.xml
          for d in $RES/mipmap-*dpi; do
            cp icon-192.png $d/ic_launcher.png
            cp icon-192.png $d/ic_launcher_round.png
            cp icon-192.png $d/ic_launcher_foreground.png
          done
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Hogwarts-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
