<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>HOGWARTS TRADING SCHOOL</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Hogwarts">
<style>
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#splash{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000;z-index:2;transition:opacity .5s}
#splash img{width:min(60vw,260px)}
iframe{position:fixed;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div id="splash"><img src="icon-512.png" alt="Hogwarts Trading School"></div>
<iframe id="app" src="https://script.google.com/macros/s/AKfycbxLEA1CencokVGZ0v4MCKaN7O2RSdO1OI_qUkTYAI3XtAJc1TTsiYOVklVvObdgGQqD5A/exec" allow="clipboard-write; fullscreen"></iframe>
<script>
document.getElementById('app').addEventListener('load',function(){
  var s=document.getElementById('splash');s.style.opacity=0;setTimeout(function(){s.remove()},500);
});
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(function(){});}
</script>
</body>
</html>
